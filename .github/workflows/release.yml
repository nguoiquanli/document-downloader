name: Release extension

on:
  push:
    branches: [main]
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -r "document-downloader-v${VERSION}.zip" . \
            -x ".git/*" ".github/*" "*.zip" ".DS_Store"

      - name: Remove previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          awk -v heading="## ${VERSION}" 'index($0, heading) == 1 {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md > release-notes.md
          gh release create "$TAG" "document-downloader-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Document Downloader ${TAG}" \
            --notes-file release-notes.md
